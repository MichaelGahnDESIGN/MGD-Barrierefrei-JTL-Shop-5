name: Qualität

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP- und XML-Prüfung
        run: find plugin -name '*.php' -print0 | xargs -0 -n1 php -l && xmllint --noout plugin/MGD_Barrierefrei/info.xml
      - name: JavaScript-Syntax
        run: node --check plugin/MGD_Barrierefrei/frontend/js/mgd-barrierefrei.js
      - name: Release-Paket
        run: sh scripts/build-release.sh && unzip -t release/MGD_Barrierefrei-1.0.0.zip
      - name: Geheimnisse prüfen
        uses: gitleaks/gitleaks-action@v2
